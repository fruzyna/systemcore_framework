name: Robot CI

on:
  push:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v1
    - name: Set up JDK 25
      uses: actions/setup-java@v1
      with:
        java-version: 25
    - name: Build with Gradle
      run: ./gradlew build
#    - name: Build javadoc with Gradle
#      run: ./gradlew javadoc
